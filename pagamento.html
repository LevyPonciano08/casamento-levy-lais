<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F1F5F5">
  <meta name="robots" content="noindex">
  <title>Pagamento do presente | Levy e Laís</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/LL.png" type="image/png">
  <link rel="stylesheet" href="registry.css?v=20260922-1"><link rel="stylesheet" href="visual.css?v=20260923-1">
</head>
<body class="payment-page">
  <main class="payment-result">
    <span class="monogram large" aria-hidden="true"></span>
    <p class="eyebrow">Lista de presentes</p>
    <h1 class="payment-heading">Seu pagamento.</h1>
    <p class="payment-message" role="status"></p>
    <div class="payment-actions">
      <a class="primary-link" href="presentes.html">Voltar à lista</a>
      <a class="secondary-link" href="index.html">Ir para o site do casamento</a>
    </div>
    <small>A confirmação final depende do processamento do Mercado Pago e pode levar alguns instantes.</small>
  </main>
  <script>
    const state = new URLSearchParams(location.search).get('retorno');
    const states = {
      sucesso: { title: 'Obrigado pelo presente.', message: 'Recebemos o retorno do checkout. A confirmação do pagamento pode levar alguns instantes.' },
      pendente: { title: 'Pagamento em análise.', message: 'O Mercado Pago ainda está processando o pagamento. Assim que ele confirmar, o presente aparecerá para os noivos.' },
      falha: { title: 'Pagamento não concluído.', message: 'Você pode voltar à lista e tentar novamente.' }
    };
    const current = states[state] || { title: 'Consulte seu pagamento.', message: 'Confira o resultado no Mercado Pago ou volte à lista de presentes.' };
    document.querySelector('.payment-heading').textContent = current.title;
    document.querySelector('.payment-message').textContent = current.message;
  </script>
</body>
</html>
